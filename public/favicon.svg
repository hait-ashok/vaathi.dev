<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="vaathi.dev">
  <!-- Soft mist tile — reads at favicon size -->
  <rect width="32" height="32" rx="7" fill="#0a5c63"/>
  <!-- Cobalt spark of curiosity at the apex -->
  <circle cx="16" cy="7.5" r="2.2" fill="#1b4dff"/>
  <!-- Open V — learning path / curiosity opening upward -->
  <path
    d="M8 11.5 L16 25.5 L24 11.5"
    stroke="#f0f5f8"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Inner teal highlight for depth at larger sizes -->
  <path
    d="M10.2 12.2 L16 23 L21.8 12.2"
    stroke="#d4ecee"
    stroke-width="1.1"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.55"
  />
</svg>
